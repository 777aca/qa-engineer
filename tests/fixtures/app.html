<label for="search">搜索</label><input id="search">
<button id="search-button">搜索</button><p data-testid="search-result"></p>
<label for="name">名称</label><input id="name">
<button id="save">保存</button><p data-testid="save-status"></p>
<script>
const nameInput = document.querySelector('#name');
nameInput.value = localStorage.getItem('savedName') || '';
document.querySelector('#search-button').onclick = () => {
  document.querySelector('[data-testid=search-result]').textContent = document.querySelector('#search').value;
};
document.querySelector('#save').onclick = () => {
  localStorage.setItem('savedName', nameInput.value);
  document.querySelector('[data-testid=save-status]').textContent = '已保存';
};
</script>
